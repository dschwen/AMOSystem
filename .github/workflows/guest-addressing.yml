name: Guest address type contract
on:
  push:
    paths: ['src/core/guest_types.h', 'src/abi/guest_address_codec.h', 'src/memory/**', 'src/host/guest_memory.cpp', 'src/host/guest_allocator.cpp', 'src/host/mark_registry.cpp', 'src/runtime/**', 'src/tables/**', 'tools/sync_runtime_bindings.py', 'tests/guest/**', 'tests/test_guest*.py', 'tests/test_runtime*.py', '.github/workflows/guest-addressing.yml', 'Makefile']
  pull_request:
    paths: ['src/core/guest_types.h', 'src/abi/guest_address_codec.h', 'src/memory/**', 'src/host/guest_memory.cpp', 'src/host/guest_allocator.cpp', 'src/host/mark_registry.cpp', 'src/runtime/**', 'src/tables/**', 'tools/sync_runtime_bindings.py', 'tests/guest/**', 'tests/test_guest*.py', 'tests/test_runtime*.py', '.github/workflows/guest-addressing.yml', 'Makefile']
permissions:
  contents: read
jobs:
  type-contract:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [g++, clang++]
    env:
      HOST_CXX: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile-fail and high-address runtime checks
        run: make test-guest-addressing
