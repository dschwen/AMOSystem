name: Windows MSI
on:
  workflow_dispatch:
    inputs:
      version:
        description: Numeric MSI version (major.minor.patch)
        default: 0.1.0
        required: true
  push:
    tags:
      - 'v*'
    branches: [guest-bias, cpp-conversion]
    paths:
      - 'src/**'
      - 'tests/windows/**'
      - 'tools/package_windows.py'
      - 'tools/package_msi.py'
      - 'examples/**'
      - 'Makefile'
      - '.github/workflows/windows-msi.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tools/**'
      - 'tests/windows/**'
      - 'tests/test_package_msi.py'
      - 'tests/test_icons.py'
      - 'tests/test_package_macos.py'
      - 'tests/test_native_cxx.py'
      - 'data/icons/**'
      - 'tests/test_open_document.py'
      - 'tests/test_clipboard.py'
      - 'packaging/windows/**'
      - 'Makefile'
      - '.github/workflows/windows-msi.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version || '0.1.0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Install cross compiler and MSI inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 wixl msitools python3-pil libsdl2-2.0-0 xvfb libxtst6
      - name: Fetch pinned SDL2 MinGW SDK
        run: |
          mkdir -p build/sdk
          curl --fail --location --retry 3 https://github.com/libsdl-org/SDL/releases/download/release-2.32.8/SDL2-devel-2.32.8-mingw.tar.gz -o build/sdk/SDL2.tar.gz
          echo 'f590b3707689562483ded05bf15eaf0f5d33eb97f49d0fd3b894225fe17cc52b  build/sdk/SDL2.tar.gz' | sha256sum -c -
          tar -xzf build/sdk/SDL2.tar.gz -C build/sdk
      - name: Build, extract and inspect MSI
        shell: bash
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          make -j2 package-msi VERSION="$VERSION" WINDOWS_CXX=x86_64-w64-mingw32-g++-win32 SDL2_WINDOWS="$PWD/build/sdk/SDL2-2.32.8/x86_64-w64-mingw32"
          make msi-probe VERSION=0.1.0
          make msi-probe VERSION=0.1.1
          make msi-probe VERSION=0.1.2
          python3 -m unittest discover -s tests -p test_package_msi.py
          python3 -m unittest discover -s tests -p test_icons.py
          python3 -m unittest discover -s tests -p test_package_macos.py
          python3 -m unittest discover -s tests -p test_native_cxx.py
      - name: Portable bundles for the Windows smoke tests (AMOS memory below 4GB, and anywhere)
        shell: bash
        run: |
          sdk="$PWD/build/sdk/SDL2-2.32.8/x86_64-w64-mingw32"
          make -j2 windows-release WINDOWS_CXX=x86_64-w64-mingw32-g++-win32 SDL2_WINDOWS="$sdk" \
               WINDOWS_BIASED=0 WINDOWS_RELEASE_DIR=build/windows-smoke-low
          make -j2 windows-release WINDOWS_CXX=x86_64-w64-mingw32-g++-win32 SDL2_WINDOWS="$sdk" \
               WINDOWS_BIASED=1 WINDOWS_RELEASE_DIR=build/windows-smoke-biased
          for kind in low biased; do
            python3 tools/package_windows.py --build build/windows-smoke-$kind --sdk "$sdk" --out build/windows-portable-$kind
          done
      - name: Upload the portable bundles
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            build/windows-portable-low.zip
            build/windows-portable-biased.zip
          if-no-files-found: error
      - name: Linux host regression check
        run: |
          make -j2 host KICKSTART= ROMKEY=
          mkdir -p build/dist
          cp -a AMOS build/dist/AMOS
          cp -a examples/. build/dist/AMOS/
          # (failures as annotations: the log of a run needs a login, annotations do not)
          say() { while read -r line; do echo "::error::${line:0:1200}"; done; }
          python3 tests/host_run.py --text-only --fallback-font > host.log 2>&1 || { grep -v ": ok" host.log | head -12 | say; exit 1; }
          python3 -m unittest discover -s tests -p test_open_document.py > open.log 2>&1 || { tail -25 open.log | say; exit 1; }
          SDL_AUDIODRIVER=dummy python3 -m unittest discover -s tests -p test_clipboard.py > clip.log 2>&1 || { tail -25 clip.log | say; exit 1; }
      - name: Upload unsigned installers and manifests
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-msi
          path: |
            build/packages/*.msi
            build/packages/*.json
            build/packages/*.ps1
            build/packages/*.AMOS
          if-no-files-found: error
  installer-tests:
    needs: build
    runs-on: windows-2022
    env:
      VERSION: ${{ inputs.version || '0.1.0' }}
    steps:
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-msi
          path: packages
      - name: Installer repair, upgrade, downgrade and rollback checks
        shell: powershell
        run: |
          & .\packages\test_msi.ps1 -Mode Probe -Packages .\packages -Artifacts .\logs
          & .\packages\test_msi.ps1 -Mode Install -Packages .\packages -Version $env:VERSION -Artifacts .\logs
          & .\packages\test_msi.ps1 -Mode Uninstall -Packages .\packages -Version $env:VERSION -Artifacts .\logs
      - name: Preserve Windows Installer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-logs
          path: logs
  smoke:
    # the interpreter itself, headless, on Windows: the five smoke tests of the portable bundle,
    # with the guest's memory below 4GB (the release) and anywhere (the biased backend)
    needs: build
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        kind: [low, biased]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: bundles
      - name: Run the smoke tests
        shell: powershell
        run: |
          # (the results as annotations: the log of a run needs a login, annotations do not)
          function Say($text) {
            $one = ($text -replace "`r?`n", ' | ')
            if ($one.Length -gt 1200) { $one = $one.Substring(0, 1200) }
            Write-Host "::error::$one"
          }
          Expand-Archive bundles\windows-portable-${{ matrix.kind }}.zip -DestinationPath run
          $dir = (Get-ChildItem run | Select-Object -First 1).FullName
          $output = & powershell -ExecutionPolicy Bypass -File "$dir\smoke.ps1" 2>&1 | Out-String
          $code = $LASTEXITCODE
          Say "smoke exit $code : $output"
          if (Test-Path "$dir\smoke-results.txt") { Say ((Get-Content "$dir\smoke-results.txt") -join ' | ') }
          Get-ChildItem "$dir\smoke" -Recurse -Include stdout.txt,stderr.txt -ErrorAction SilentlyContinue | ForEach-Object {
            $text = (Get-Content $_.FullName -TotalCount 12 -ErrorAction SilentlyContinue) -join ' | '
            if ($text) { Say "$($_.Directory.Name)/$($_.Name): $text" }
          }
          exit $code
      - name: Preserve the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-${{ matrix.kind }}
          path: run
  release:
    # a v* tag: the installer that passed its tests goes onto the GitHub release (unsigned)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, installer-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-msi
          path: packages
      - name: Attach the MSI to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # (not the upgrade probes' MSIs, which are in the artifact too)
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" "packages/amos-$version-windows-x64.msi" "packages/amos-$version-windows-x64.json" --clobber
