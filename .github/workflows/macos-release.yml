name: macOS release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (major.minor.patch)
        default: 0.1.0
        required: true
  push:
    tags:
      - 'v*'
    branches: [guest-bias, cpp-conversion]
    paths:
      - 'tools/package_macos.py'
      - 'examples/**'
      - 'packaging/macos/**'
      - 'Makefile'
      - '.github/workflows/macos-release.yml'
  pull_request:
    paths:
      - 'tools/package_macos.py'
      - 'tools/install_icons.py'
      - 'packaging/macos/**'
      - 'data/icons/**'
      - 'Makefile'
      - '.github/workflows/macos-release.yml'
permissions:
  contents: read
jobs:
  dmg:
    # Two apps, each built with the Command Line Tools' clang: Intel (-arch x86_64, which an Apple
    # Silicon runner also does) and native Apple Silicon (arm64, the guest's memory biased).
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version || '0.1.0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Fetch the pinned SDL2 framework
        run: |
          curl --fail --location --retry 3 https://www.libsdl.org/release/SDL2-2.30.12.dmg -o SDL2.dmg
          echo 'a8fcd488a8062f632bacd7a74dbbb5f585f3b0303ccf08384ac0349eccd8420d  SDL2.dmg' | shasum -a 256 -c -
          hdiutil attach SDL2.dmg -mountpoint /Volumes/SDL2 -nobrowse -quiet
          mkdir -p build/sdk && cp -R /Volumes/SDL2/SDL2.framework build/sdk/
          hdiutil detach /Volumes/SDL2 -quiet
      - name: Build the app and DMG
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          # (the errors as annotations: the log of a run needs a login, annotations do not)
          if ! make -j3 package-dmg VERSION="$VERSION" MACOS_PKG_ARCH=${{ matrix.arch }} MACOS_SDL_FRAMEWORK="$PWD/build/sdk/SDL2.framework" > build.log 2>&1; then
            grep -E "error|Error|undefined|ld:" build.log | head -8 | while read -r line; do echo "::error::${line:0:900}"; done
            exit 1
          fi
          tail -3 build.log
          ls -l build/packages
      - name: Package tests
        run: python3 -m unittest discover -s tests -p test_package_macos.py
      - uses: actions/upload-artifact@v4
        with:
          name: amos-${{ env.VERSION }}-macos-${{ matrix.arch }}
          path: |
            build/packages/*.dmg
            build/packages/*macos*.json
          if-no-files-found: error
      - name: Attach the DMG to the release (ad-hoc signed, not notarized)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" build/packages/*.dmg build/packages/*macos*.json --clobber
