name: macOS Apple Silicon
# The native arm64 host: the guest's memory anywhere in the address space (AMOS_GUEST_BIASED),
# run on a real Apple Silicon runner (text tests: no window, no sound).
on:
  workflow_dispatch:
  push:
    branches: [guest-bias, cpp-conversion]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Makefile'
      - '.github/workflows/macos-arm64.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Makefile'
      - '.github/workflows/macos-arm64.yml'
permissions:
  contents: read
jobs:
  arm64:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          uname -m
          python3 -m pip install --break-system-packages pillow || python3 -m pip install pillow
      - name: Build the arm64 host
        run: |
          # (the errors as annotations: the log of a run needs a login, annotations do not)
          if ! make -j3 host HOST_TARGET_ARCH=arm64 HOST_ARCHFLAGS='-arch arm64' HOST_CXX=clang++ KICKSTART= ROMKEY= > build.log 2>&1; then
            grep -E "error|Error|undefined|ld:" build.log | head -8 | while read -r line; do echo "::error::${line:0:900}"; done
            exit 1
          fi
          file build/host/amos
      - name: Hello
        run: |
          mkdir -p build/dist && cp -a AMOS build/dist/AMOS && cp -a examples/. build/dist/AMOS/
          annotate() { while read -r line; do echo "::error::${line:0:900}"; done; }
          python3 - <<'PY'
          import sys; sys.path.insert(0, 'tools'); import amostok
          t = amostok.Tables(['AMOS/APSystem'])
          amostok.tokenize_program('Open Out 1,"out.txt"\nPrint #1,"hello"\nClose 1\nSystem\n', t).save('/tmp/hi.AMOS')
          PY
          ln -sf "$PWD/build/host/amos" /tmp/amos-player
          H="$PWD/build/dist/AMOS"
          W="$PWD"
          cd /tmp && rm -f out.txt
          set +e
          AMOS_HOME="$H" AMOS_DISPLAY=none AMOS_CONFIG=/dev/null AMOS_ESCAPE_LOG=1 /tmp/amos-player hi.AMOS > hi.log 2>&1
          rc=$?
          set -e
          { echo "exit $rc"; tail -25 hi.log; ls -l out.txt 2>&1; } | annotate
          if [ $rc -ne 0 ]; then
            # (in the background and killed after 40s: whatever it printed is then reported)
            AMOS_CRASH_TRACE=1 AMOS_HOME="$H" AMOS_DISPLAY=none AMOS_CONFIG=/dev/null /tmp/amos-player hi.AMOS > trace.log 2>&1 < /dev/null &
            pid=$!
            for i in $(seq 1 40); do kill -0 $pid 2> /dev/null || break; sleep 1; done
            kill -9 $pid 2> /dev/null || true
            { echo "trace: $(head -40 trace.log | sed "s/amos: //" | tr "\n" "|")"; } | annotate
            load=$(grep "loaded at" trace.log | sed 's/.*loaded at //')
            addrs=$(grep -E "amos: (frame|pc)" trace.log | grep -oE "0x[0-9a-f]{9,}" | tr '\n' ' ')
            atos -o "$W/build/host/amos" -arch arm64 -l "${load:-0x100000000}" $addrs > atos.log 2>&1 < /dev/null &
            apid=$!
            for i in $(seq 1 20); do kill -0 $apid 2> /dev/null || break; sleep 1; done
            kill -9 $apid 2> /dev/null || true
            { echo "symbols: $(head -30 atos.log | tr "\n" "|")"; } | annotate
          fi
          test -f out.txt
      - name: Text tests
        run: |
          python3 tests/host_run.py --text-only --fallback-font -j3 > tests.log 2>&1 || { grep -v ": ok" tests.log | head -20 | while read -r line; do echo "::error::${line:0:600}"; done; exit 1; }
          tail -1 tests.log
